[project]
name = "align"
version = "0.1.0"
description = "Reproducible tools for local-coordination UAV formation research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
align = "align.cli:main"

[build-system]
requires = ["uv_build==0.9.28"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv.build-backend]
source-include = ["scripts/**", "docs/**", "tests/**", "uv.lock", ".python-version", "AGENTS.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
